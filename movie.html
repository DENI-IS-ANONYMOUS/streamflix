<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>StreamFlix — Movie</title><link rel="stylesheet" href="styles.css"></head><body>
<header class="topbar" id="topbar"><div class="logo" onclick="location.href='index.html'">STREAMFLIX</div><nav class="nav"><button onclick="location.href='index.html'">Home</button><button onclick="location.href='index.html#content'">Movies</button><button onclick="location.href='index.html#content'">Action</button><button onclick="location.href='index.html#content'">Drama & Comedy</button><button onclick="location.href='index.html'">My List</button></nav><div class="actions"><div class="search"><span>⌕</span><input id="detailSearch" placeholder="Search titles..." oninput="detailSearch(this.value)"></div><button class="menu-trigger" id="accountMenuBtn" onclick="openAccountMenu()" title="Menu">☰</button><button class="avatar" id="headerAvatar" onclick="location.href='profile.html'" aria-label="Profile"></button><div id="accountMenu" class="account-menu hidden"></div></div></header>
<main class="page"><div class="detail"><div id="detailHero"></div><div id="playerArea" style="margin-top:20px"></div><div id="detailBody"></div></div></main><div id="toast" class="toast"></div>
<script src="data.js"></script><script src="player.js"></script><script src="profile.js"></script><script src="app.js"></script><script>
const id=new URLSearchParams(location.search).get('id')||0,m=movieById(id);document.title='StreamFlix — '+m.title;
const tags=(m.genres||[m.category]).map(x=>`<span class="chip">${x}</span>`).join('');
document.getElementById('detailHero').innerHTML=`<section class="detail-hero" style="background-image:url('${m.thumb}')"><div class="detail-copy"><div class="eyebrow">${m.category} · ${m.year}</div><h1>${m.title}</h1><div class="meta"><b>${m.match}% Match</b><span>${m.year}</span><span>${m.rating}</span><span>${m.duration}</span></div><p>${m.description}</p><div>${tags}</div><div style="margin-top:16px"><button class="btn primary" onclick="playMovie()">▶ ${m.isPlayable?'Play':'Preview unavailable'}</button><button class="btn secondary" onclick="toggleDetailList()">${JSON.parse(localStorage.getItem('streamflix_list')||'[]').includes(m.id)?'✓ In My List':'＋ My List'}</button></div></div></section>`;
function playMovie(){if(!m.video){toast('This catalog title does not have a playable video attached yet.');return}document.getElementById('playerArea').scrollIntoView({behavior:'smooth'});setTimeout(()=>document.getElementById('video')?.play(),250)}
if(m.video){document.getElementById('playerArea').innerHTML=makePlayer(m);initPlayer()}else document.getElementById('playerArea').innerHTML='<div class="panel" style="padding:40px;text-align:center">This catalog title is available as a movie listing. Add a licensed/owned video file to enable playback.</div>';
const cast=(m.cast||[]),crew=(m.crew||[]);const related=MOVIES.filter(x=>x.id!==m.id&&x.category===m.category).sort((a,b)=>b.match-a.match).slice(0,8);const fallback=MOVIES.filter(x=>x.id!==m.id&&x.category!==m.category).sort((a,b)=>b.match-a.match).slice(0,4);
function people(items,kind){return items.map(x=>`<div class="person"><b>${x}</b><span>${kind}</span></div>`).join('')}
document.getElementById('detailBody').innerHTML=`<div class="detail-body"><section><h2>About ${m.title}</h2><p style="color:#ccc;line-height:1.7">${m.description}</p><h2>Genres</h2><div class="chips">${tags}</div><h2>Cast</h2><div class="cast">${people(cast,'Cast information')}</div><h2>Crew</h2><div class="cast">${people(crew,'Crew information')}</div></section><aside><h2>Movie info</h2><div class="person"><b>Category</b><span>${m.category}</span></div><div class="person"><b>Year</b><span>${m.year}</span></div><div class="person"><b>Rating</b><span>${m.rating}</span></div><div class="person"><b>Runtime</b><span>${m.duration}</span></div><div class="person"><b>Match</b><span>${m.match}%</span></div></aside></div><section class="section"><div class="section-head"><h2>More like this</h2><span class="section-count">${related.length}</span></div><div class="row">${related.map(card).join('')}</div></section><section class="section"><div class="section-head"><h2>You may also like</h2><span class="section-count">${fallback.length}</span></div><div class="row">${fallback.map(card).join('')}</div></section>`;
function toggleDetailList(){let a=JSON.parse(localStorage.getItem('streamflix_list')||'[]');a.includes(m.id)?a=a.filter(x=>x!==m.id):a.push(m.id);localStorage.setItem('streamflix_list',JSON.stringify(a));document.querySelector('.detail-copy .secondary').textContent=a.includes(m.id)?'✓ In My List':'＋ My List';toast(a.includes(m.id)?'Added to My List':'Removed from My List')}
function detailSearch(q){q=q.trim().toLowerCase();if(!q)return;const hit=MOVIES.find(x=>x.title.toLowerCase().includes(q));if(hit)location.href='movie.html?id='+hit.id}
if(localStorage.getItem('streamflix_auth')!=='1'){location.href='index.html?loggedout=1'}else{renderAccountMenu();renderHeaderAvatar();}
</script></body></html>
